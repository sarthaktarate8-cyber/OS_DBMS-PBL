<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Illustrative phase-shifting workload with policy switches" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 14px; fill: #e5e9ff; text-anchor: middle; font-weight: 600; }
    .s { font-size: 12px; fill: #94a3b8; text-anchor: middle; }
    .ax { font-size: 12px; fill: #64748b; }
    .line { fill: none; stroke: #34d399; stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 5s ease-out .3s forwards; }
    .mk { opacity: 0; animation: pop .4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
  </style>
  <rect width="1100" height="360" rx="18" fill="#080d1f"/>
  <text x="550" y="34" class="t" style="font-size:16px">Phase-shifting workload — illustrative behaviour, not measured data</text>
  <!-- phase bands -->
  <rect x="70" y="60" width="240" height="190" fill="#22d3ee" opacity="0.10"/>
  <rect x="310" y="60" width="260" height="190" fill="#8b5cf6" opacity="0.12"/>
  <rect x="570" y="60" width="200" height="190" fill="#fbbf24" opacity="0.10"/>
  <rect x="770" y="60" width="260" height="190" fill="#22d3ee" opacity="0.10"/>
  <text x="190" y="82" class="t">Recency-heavy</text><text x="190" y="100" class="s">policy: LRU</text>
  <text x="440" y="82" class="t">Zipfian hot set</text><text x="440" y="100" class="s">policy: LFU</text>
  <text x="670" y="82" class="t">Sequential scan</text><text x="670" y="100" class="s">policy: FIFO</text>
  <text x="900" y="82" class="t">Recency again</text><text x="900" y="100" class="s">policy: LRU</text>
  <!-- axes -->
  <path d="M70 250H1030M70 60V250" stroke="#334155" stroke-width="1.5" fill="none"/>
  <text x="62" y="254" class="ax" text-anchor="end">0%</text>
  <text x="62" y="68" class="ax" text-anchor="end">100%</text>
  <text x="550" y="278" class="s">time (accesses) →</text>
  <text x="30" y="160" class="ax" transform="rotate(-90 30 160)" text-anchor="middle">hit ratio</text>
  <!-- hit ratio curve: dips at each phase shift, recovers after switch -->
  <path class="line" d="M70 150 L150 120 L250 116 L310 118 L330 190 L360 170 L420 130 L520 118 L570 120 L590 205 L630 190 L700 192 L770 190 L790 215 L830 160 L900 125 L1030 118"/>
  <!-- switch markers -->
  <g class="mk" style="animation-delay:2.0s"><line x1="345" y1="60" x2="345" y2="250" stroke="#fb7185" stroke-dasharray="4 4"/><circle cx="345" cy="175" r="6" fill="#fb7185"/></g>
  <g class="mk" style="animation-delay:3.2s"><line x1="605" y1="60" x2="605" y2="250" stroke="#fb7185" stroke-dasharray="4 4"/><circle cx="605" cy="198" r="6" fill="#fb7185"/></g>
  <g class="mk" style="animation-delay:4.3s"><line x1="815" y1="60" x2="815" y2="250" stroke="#fb7185" stroke-dasharray="4 4"/><circle cx="815" cy="185" r="6" fill="#fb7185"/></g>
  <!-- rejected switch (noise) -->
  <g class="mk" style="animation-delay:2.6s"><circle cx="500" cy="122" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="500" y="145" class="s">noise: switch rejected</text></g>
  <!-- legend -->
  <circle cx="330" cy="316" r="6" fill="#fb7185"/><text x="344" y="320" class="ax">policy switch (net benefit &gt; 0)</text>
  <circle cx="620" cy="316" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="634" y="320" class="ax">blocked by hysteresis / cooldown</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="MEMORA - Saviours of Memory" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#101734"/><stop offset="1" stop-color="#1d1146"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#fb7185"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 104px; font-weight: 800; letter-spacing: 14px; fill: url(#title); opacity: 0; animation: rise 1.2s ease-out .2s forwards; }
    .sub   { font-size: 22px; letter-spacing: 9px; fill: #a5b4fc; opacity: 0; animation: rise 1.2s ease-out .7s forwards; }
    .tag   { font-size: 16px; fill: #94a3b8; opacity: 0; animation: rise 1.2s ease-out 1.1s forwards; }
    .frame rect { fill: #121a3d; stroke: #3b4a9a; stroke-width: 1.5; animation: cell 4.2s ease-in-out infinite; animation-delay: inherit; }
    .frame { animation: none; }
    .fid { font-size: 13px; fill: #7c8bd0; text-anchor: middle; font-family: Consolas, "SF Mono", monospace; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cell {
      0%, 100% { fill: #121a3d; stroke: #3b4a9a; }
      12% { fill: #0f5f52; stroke: #34d399; }
      28% { fill: #121a3d; stroke: #3b4a9a; }
      50% { fill: #6b1f3a; stroke: #fb7185; }
      64% { fill: #121a3d; stroke: #3b4a9a; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <!-- drifting data particles -->
  <g fill="#22d3ee" opacity="0.5">
    <circle cx="90" cy="60" r="2"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="90" r="2.5" fill="#8b5cf6"><animate attributeName="cy" values="90;60;90" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="40" r="1.8" fill="#fb7185"><animate attributeName="cy" values="40;70;40" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="150" r="1.8" fill="#34d399"><animate attributeName="cy" values="150;120;150" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>
  <g filter="url(#glow)">
    <text x="600" y="128" text-anchor="middle" class="title">MEMORA</text>
  </g>
  <text x="600" y="168" text-anchor="middle" class="sub">SAVIOURS OF MEMORY</text>
  <text x="600" y="200" text-anchor="middle" class="tag">Workload-aware adaptive buffer management for database systems</text>
  <!-- buffer pool frames: green = hit, red = miss/evict -->
  <g class="frame" style="animation-delay:0.00s">
    <rect x="120" y="232" width="64" height="40" rx="6"/>
    <text x="152" y="257" class="fid">P1</text>
  </g>
  <g class="frame" style="animation-delay:0.35s">
    <rect x="200" y="232" width="64" height="40" rx="6"/>
    <text x="232" y="257" class="fid">P8</text>
  </g>
  <g class="frame" style="animation-delay:0.70s">
    <rect x="280" y="232" width="64" height="40" rx="6"/>
    <text x="312" y="257" class="fid">P15</text>
  </g>
  <g class="frame" style="animation-delay:1.05s">
    <rect x="360" y="232" width="64" height="40" rx="6"/>
    <text x="392" y="257" class="fid">P22</text>
  </g>
  <g class="frame" style="animation-delay:1.40s">
    <rect x="440" y="232" width="64" height="40" rx="6"/>
    <text x="472" y="257" class="fid">P6</text>
  </g>
  <g class="frame" style="animation-delay:1.75s">
    <rect x="520" y="232" width="64" height="40" rx="6"/>
    <text x="552" y="257" class="fid">P13</text>
  </g>
  <g class="frame" style="animation-delay:2.10s">
    <rect x="600" y="232" width="64" height="40" rx="6"/>
    <text x="632" y="257" class="fid">P20</text>
  </g>
  <g class="frame" style="animation-delay:2.45s">
    <rect x="680" y="232" width="64" height="40" rx="6"/>
    <text x="712" y="257" class="fid">P4</text>
  </g>
  <g class="frame" style="animation-delay:2.80s">
    <rect x="760" y="232" width="64" height="40" rx="6"/>
    <text x="792" y="257" class="fid">P11</text>
  </g>
  <g class="frame" style="animation-delay:3.15s">
    <rect x="840" y="232" width="64" height="40" rx="6"/>
    <text x="872" y="257" class="fid">P18</text>
  </g>
  <g class="frame" style="animation-delay:3.50s">
    <rect x="920" y="232" width="64" height="40" rx="6"/>
    <text x="952" y="257" class="fid">P2</text>
  </g>
  <g class="frame" style="animation-delay:3.85s">
    <rect x="1000" y="232" width="64" height="40" rx="6"/>
    <text x="1032" y="257" class="fid">P9</text>
  </g>
  <text x="120" y="298" class="fid" style="text-anchor:start">buffer pool</text>
  <text x="1080" y="298" class="fid" style="text-anchor:end">hit · miss · evict</text>
</svg>

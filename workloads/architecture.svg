<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="MEMORA architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .bt { font-size: 19px; font-weight: 700; fill: #e5e9ff; text-anchor: middle; }
    .bs { font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .lbl { font-size: 13px; fill: #a5b4fc; text-anchor: middle; }
    .flow { fill: none; stroke-width: 2.5; stroke-dasharray: 8 8; animation: dash 1.2s linear infinite; }
    .back { stroke-dasharray: 3 9; animation-duration: 1.8s; }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1100" height="440" rx="18" fill="#080d1f"/>
  <text x="550" y="40" class="bt" style="font-size:16px;fill:#7c8bd0">Closed-loop adaptive buffer management</text>
  <g>
    <rect x="30" y="110" width="210" height="120" rx="14" fill="#0f1630" stroke="#64748b" stroke-width="2"/>
    <rect x="30" y="110" width="210" height="6" rx="3" fill="#64748b"/>
    <text x="135.0" y="156" class="bt">Access Stream</text>
    <text x="135.0" y="182" class="bs">Trace or live DBMS</text>
    <text x="135.0" y="202" class="bs">page requests</text>
  </g>
  <g>
    <rect x="290" y="110" width="210" height="120" rx="14" fill="#0f1630" stroke="#22d3ee" stroke-width="2"/>
    <rect x="290" y="110" width="210" height="6" rx="3" fill="#22d3ee"/>
    <text x="395.0" y="156" class="bt">Buffer Pool</text>
    <text x="395.0" y="182" class="bs">Frames · hit / miss</text>
    <text x="395.0" y="202" class="bs">LRU · LFU · FIFO</text>
  </g>
  <g>
    <rect x="560" y="110" width="230" height="120" rx="14" fill="#0f1630" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="560" y="110" width="230" height="6" rx="3" fill="#8b5cf6"/>
    <text x="675.0" y="156" class="bt">Phase Detector</text>
    <text x="675.0" y="182" class="bs">JSD · entropy</text>
    <text x="675.0" y="202" class="bs">sequentiality · reuse dist.</text>
  </g>
  <g>
    <rect x="850" y="110" width="220" height="120" rx="14" fill="#0f1630" stroke="#fb7185" stroke-width="2"/>
    <rect x="850" y="110" width="220" height="6" rx="3" fill="#fb7185"/>
    <text x="960.0" y="156" class="bt">Cost-Benefit Engine</text>
    <text x="960.0" y="182" class="bs">net benefit gate</text>
    <text x="960.0" y="202" class="bs">hysteresis · cooldown</text>
  </g>
  <path class="flow" d="M240 170H284" stroke="#22d3ee" marker-end="url(#a1)"/>
  <path class="flow" d="M500 170H554" stroke="#22d3ee" marker-end="url(#a1)"/>
  <path class="flow" d="M790 170H844" stroke="#22d3ee" marker-end="url(#a1)"/>
  <text x="527" y="156" class="lbl">window</text>
  <text x="817" y="156" class="lbl">signal</text>
  <!-- feedback loop -->
  <path id="loop" class="flow back" d="M960 230V340H395V236" stroke="#fbbf24" marker-end="url(#a2)"/>
  <text x="680" y="332" class="lbl" style="fill:#fbbf24">policy switch only when expected gain &gt; overhead + cold-miss penalty</text>
  <circle r="5" fill="#fbbf24"><animateMotion dur="4s" repeatCount="indefinite" path="M960 230V340H395V236"/></circle>
  <circle r="5" fill="#22d3ee"><animateMotion dur="3s" repeatCount="indefinite" path="M240 170H284"/></circle>
  <circle r="5" fill="#22d3ee"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M500 170H554"/></circle>
  <circle r="5" fill="#22d3ee"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M790 170H844"/></circle>
  <text x="550" y="400" class="bs">observe → detect → evaluate → switch (or stay)</text>
</svg>
